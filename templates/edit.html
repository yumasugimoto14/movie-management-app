
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>映画編集</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="container">
        <h1>映画編集</h1>

        <form action="/edit/{{ movie['id'] }}" method="post">

            <div class="form-group">
                <label for="title">タイトル</label>
                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{ movie['title'] }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="director">監督</label>
                <input
                    type="text"
                    id="director"
                    name="director"
                    value="{{ movie['director'] }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="genre">ジャンル</label>
                <input
                    type="text"
                    id="genre"
                    name="genre"
                    value="{{ movie['genre'] }}"
                >
            </div>

            <div class="form-group">
                <label for="year">公開年</label>
                <input
                    type="number"
                    id="year"
                    name="year"
                    min="1888"
                    max="2100"
                    value="{{ movie['year'] }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="rating">評価（1〜5）</label>
                <select id="rating" name="rating" required>
                    {% for value in range(1, 6) %}
                        <option
                            value="{{ value }}"
                            {% if movie['rating'] == value %}selected{% endif %}
                        >
                            {{ "★" * value }}{{ "☆" * (5 - value) }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="button">
                更新する
            </button>

        </form>

        <a href="/" class="back-link">一覧に戻る</a>
    </div>

</body>
</html>
