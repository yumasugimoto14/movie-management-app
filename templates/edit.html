
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>映画情報の編集</title>

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <h1>映画情報の編集</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form action="/edit/{{ movie.id }}" method="post">

        <div>
            <label for="title">タイトル</label>
            <input
                type="text"
                id="title"
                name="title"
                value="{{ movie.title }}"
                required
            >
        </div>

        <div>
            <label for="director">監督</label>
            <input
                type="text"
                id="director"
                name="director"
                value="{{ movie.director }}"
                required
            >
        </div>

        <div>
            <label for="genre">ジャンル</label>
            <input
                type="text"
                id="genre"
                name="genre"
                value="{{ movie.genre }}"
                required
            >
        </div>

        <div>
            <label for="year">公開年</label>
            <input
                type="number"
                id="year"
                name="year"
                value="{{ movie.year }}"
                min="1888"
                max="2100"
                required
            >
        </div>

        <div>
            <label for="rating">評価（1〜5）</label>
            <input
                type="number"
                id="rating"
                name="rating"
                value="{{ movie.rating }}"
                min="1"
                max="5"
                required
            >
        </div>

        <button type="submit">更新する</button>

    </form>

    <p>
        <a href="/">映画一覧に戻る</a>
    </p>

</body>
</html>
