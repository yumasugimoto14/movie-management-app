
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>映画管理アプリ</title>

    <!-- CSSの読み込み -->
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <header>
        <h1>映画管理アプリ</h1>
    </header>

    <main>
        <!-- 映画登録フォーム -->
        <section>
            <h2>映画を新規登録</h2>

            <form id="movie-form">
                <div>
                    <label for="title">タイトル</label>
                    <input
                        type="text"
                        id="title"
                        name="title"
                        required
                    >
                </div>

                <div>
                    <label for="director">監督</label>
                    <input
                        type="text"
                        id="director"
                        name="director"
                        required
                    >
                </div>

                <div>
                    <label for="genre">ジャンル</label>
                    <input
                        type="text"
                        id="genre"
                        name="genre"
                        required
                    >
                </div>

                <div>
                    <label for="year">公開年</label>
                    <input
                        type="number"
                        id="year"
                        name="year"
                        required
                    >
                </div>

                <div>
                    <label for="rating">評価（1〜5）</label>
                    <input
                        type="number"
                        id="rating"
                        name="rating"
                        min="1"
                        max="5"
                        required
                    >
                </div>

                <button type="submit">映画を登録</button>
            </form>

            <!-- 登録結果・エラーメッセージ -->
            <p id="message"></p>
        </section>

        <!-- 映画一覧 -->
        <section>
            <h2>登録済みの映画一覧</h2>

            <div id="movie-list">
                <!-- JavaScriptで映画情報を表示する -->
            </div>
        </section>
        <!-- 映画編集フォーム -->
        <section id="edit-section" style="display: none;">

            <h2>映画情報を編集</h2>

            <form id="edit-form">

                <input type="hidden" id="edit-id">

                <div>
                    <label for="edit-title">タイトル</label>
                    <input type="text" id="edit-title" required>
                </div>

                <div>
                    <label for="edit-director">監督</label>
                    <input type="text" id="edit-director" required>
                </div>

                <div>
                    <label for="edit-genre">ジャンル</label>
                    <input type="text" id="edit-genre" required>
                </div>

                <div>
                    <label for="edit-year">公開年</label>
                    <input type="number" id="edit-year" required>
                </div>

                <div>
                    <label for="edit-rating">評価</label>
                    <input
                        type="number"
                        id="edit-rating"
                        min="1"
                        max="5"
                        required
                    >
                </div>

                <button type="submit">更新する</button>
                <button type="button" id="cancel-edit">キャンセル</button>

            </form>

        </section>
    </main>

    <!-- JavaScriptの読み込み -->
    <script src="/static/script.js"></script>
</body>
</html>
