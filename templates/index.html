<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>映画管理アプリ</title>

    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>

<body>

    <h1>映画管理アプリ</h1>

    <h2>映画一覧</h2>
    <a href="/add">映画を登録する</a>

    {% if movies %}

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>タイトル</th>
                    <th>監督</th>
                    <th>ジャンル</th>
                    <th>公開年</th>
                    <th>評価</th>
                </tr>
            </thead>

            <tbody>

                {% for movie in movies %}

                    <tr>
                        <td>{{ movie.id }}</td>
                        <td>{{ movie.title }}</td>
                        <td>{{ movie.director }}</td>
                        <td>{{ movie.genre }}</td>
                        <td>{{ movie.year }}</td>
                        <td>{{ movie.rating }}</td>
                    </tr>

                {% endfor %}

            </tbody>
        </table>

    {% else %}

        <p>登録されている映画はありません。</p>

    {% endif %}

</body>

</html>
