<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>映画登録</title>

    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>

<body>

    <h1>映画管理アプリ</h1>

    <h2>映画登録</h2>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form action="/add" method="post">

        <div>
            <label for="title">タイトル</label>
            <input
                type="text"
                id="title"
                name="title"
                required
            >
        </div>

        <div>
            <label for="director">監督</label>
            <input
                type="text"
                id="director"
                name="director"
            >
        </div>

        <div>
            <label for="genre">ジャンル</label>
            <input
                type="text"
                id="genre"
                name="genre"
            >
        </div>

        <div>
            <label for="year">公開年</label>
            <input
                type="number"
                id="year"
                name="year"
                min="1"
                required
            >
        </div>

        <div>
            <label for="rating">評価（1〜5）</label>
            <input
                type="number"
                id="rating"
                name="rating"
                min="1"
                max="5"
                required
            >
        </div>

        <button type="submit">登録</button>

    </form>

    <p>
        <a href="/">映画一覧に戻る</a>
    </p>

</body>

</html>
